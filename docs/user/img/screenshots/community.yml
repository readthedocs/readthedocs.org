# Redirects list, with sample docs-like paths
- url: ${COMMUNITY_URL}/dashboard/${BUSY_PROJECT}/redirects/
  javascript: |-
    ${HELPERS}
    const redirects = [
      ["/en/latest/install.html", "/en/latest/installation.html"],
      ["/$lang/$version/", "/$lang/$version/"],
      ["/en/latest/faq.html", "/en/latest/help/faq.html"],
    ];
    // Same markup as the template: $lang and $version are highlighted
    const path = (p) => p.split(/(\$lang|\$version)/).filter(Boolean)
      .map((s) => (s.startsWith("$") ? `<span class="ui violet text">${s}</span>` : `<span>${s}</span>`)).join("");
    // Keep the first rows and the last one, so the move up/down buttons are right
    const rows = [...document.querySelectorAll("table tbody tr")];
    rows.slice(redirects.length - 1, -1).forEach((row) => row.remove());
    document.querySelectorAll("table tbody tr").forEach((row, i) => {
      row.querySelector(".content > a").innerHTML = path(redirects[i][0]);
      const to = row.querySelector(".sub.header");
      to.replaceChildren(to.querySelector("label"), " ");
      to.insertAdjacentHTML("beforeend", path(redirects[i][1]));
    });
    mainColumn();
  selector: "#shot"
  output: ${OUT}/img/screenshot_redirects.png

