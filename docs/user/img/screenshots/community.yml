# Repository search answers with a sample repository
- url: ${COMMUNITY_URL}/dashboard/import/
  javascript: |-
    ${HELPERS}
    (async () => {
      const input = xpath("//label[contains(., 'Repository name')]/following::input[1]");
      const search = input.closest(".ui.search");
      fakeSearch(search, [{
        pk: 1,
        name: "tutorial",
        full_name: "example-user/tutorial",
        description: "Tutorial project for Read the Docs",
        admin: true,
        avatar_url: "https://assets.readthedocs.org/static/images/silhouette.png",
        ssh_url: "git@github.com:example-user/tutorial.git",
        clone_url: "https://github.com/example-user/tutorial.git",
        html_url: "https://github.com/example-user/tutorial",
        vcs: "git",
        vcs_provider: "github",
        private: false,
        default_branch: "main",
        projects: [],
        remote_organization: null,
      }]);
      input.value = "tutorial";
      jQuery(search).search("query");
      (await until(() => search.querySelector(".results .result"))).click();
      await sleep(800);
      jQuery(search).search("hide results");
      input.blur();
      aboveFooter();
    })();
  selector: "#shot"
  output: ${OUT}/_static/images/tutorial/rtd-import-projects.png

# Build log made to look like the tutorial template's build
- url: ${COMMUNITY_URL}/projects/${BUSY_PROJECT}/builds/${BUILD_ID}/
  javascript: |-
    ${HELPERS}
    (async () => {
      // The log loads after the page
      await until(() => xpath("//*[starts-with(normalize-space(text()), 'asdf global python')]"));
      renameExact(["docs", "${PROJECT}", "${BUSY_PROJECT}"], "tutorial");
      recentTimes();
      replaceText([
        [String.raw`https://github\.com/\S+\.git`, "https://github.com/example-user/tutorial.git"],
        [String.raw`/home/docs/checkouts/[^/]+/envs/`, "/home/docs/checkouts/readthedocs.org/user_builds/tutorial/envs/"],
        [String.raw`-r requirements\.txt`, "-r docs/requirements.txt"],
        [String.raw`cat docs/conf\.py`, "cat docs/source/conf.py"],
        [String.raw` \. \$READTHEDOCS_OUTPUT`, " docs/source $READTHEDOCS_OUTPUT"],
        // The first build uses the template's Python version
        [String.raw`asdf global python \S+`, "asdf global python 3.13.14"],
      ], true);
      setCounters(1, 1);
      aboveFooter();
    })();
  selector: "#shot"
  output: ${OUT}/_static/images/tutorial/rtd-first-successful-build.png

# Just the Python commands of the build log, with the virtualenv command expanded
- url: ${COMMUNITY_URL}/projects/${BUSY_PROJECT}/builds/${BUILD_ID}/
  javascript: |-
    ${HELPERS}
    (async () => {
      // The log loads after the page
      const virtualenv = await until(() => xpath("//*[starts-with(normalize-space(text()), 'python -mvirtualenv')]"));
      renameExact(["docs", "${PROJECT}", "${BUSY_PROJECT}"], "tutorial");
      recentTimes();
      virtualenv.click();
      await sleep(800);
      replaceText([
        [String.raw`https://github\.com/\S+\.git`, "https://github.com/example-user/tutorial.git"],
        [String.raw`/home/docs/checkouts/[^/]+/envs/`, "/home/docs/checkouts/readthedocs.org/user_builds/tutorial/envs/"],
        [String.raw`-r requirements\.txt`, "-r docs/requirements.txt"],
      ], true);
      const start = xpath("//*[starts-with(normalize-space(text()), 'asdf global python')]");
      const end = xpath("//*[starts-with(normalize-space(text()), 'python -m pip install --upgrade --no-cache-dir pip')]");
      const log = box(start.closest('[class*="segment"]'));
      const top = box(start).top;
      clip({ x: log.left, y: top - 6, width: log.right - log.left, height: box(end).bottom - top + 12 });
    })();
  selector: "#shot"
  output: ${OUT}/_static/images/tutorial/build-python.png

# Project home with only the latest version, as after the first build
- url: ${COMMUNITY_URL}/projects/${PROJECT}/
