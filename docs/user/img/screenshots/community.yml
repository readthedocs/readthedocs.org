  selector: "#shot"
  output: ${OUT}/_static/images/tutorial/rtd-project-home.png

- url: ${COMMUNITY_URL}/projects/${PROJECT}/
  javascript: |-
    ${HELPERS}
    renameExact(["docs", "${PROJECT}", "${BUSY_PROJECT}"], "tutorial");
    recentTimes("5 minutes ago");
    removePagination();
    const version = (row) => row.querySelector("a")?.textContent.trim();
    const rows = [...document.querySelectorAll("table tbody tr")];
    rows.filter((row) => !["latest", "stable"].includes(version(row))).forEach((row) => row.remove());
    if (!rows.some((row) => version(row) === "stable")) {
      // Not on the first page: show one like latest, without its Default label
      const latest = rows.find((row) => version(row) === "latest");
      const stable = latest.cloneNode(true);
      const walker = document.createTreeWalker(stable, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) {
        if (walker.currentNode.nodeValue.trim() === "latest") walker.currentNode.nodeValue = "stable";
      }
      [...stable.querySelectorAll(".label")].filter((l) => l.textContent.trim() === "Default").forEach((l) => l.remove());
      latest.before(stable);
    }
    setCounters(2, 3);
    aboveFooter();
  selector: "#shot"
  output: ${OUT}/_static/images/tutorial/active-versions.png

# Version search answers with sample versions, one of them inactive
- url: ${COMMUNITY_URL}/dashboard/${PROJECT}/version/create/
  javascript: |-
    ${HELPERS}
    (async () => {
      renameExact(["docs", "${PROJECT}", "${BUSY_PROJECT}"], "tutorial");
      setCounters(2, 3);
      const version = (name, active, identifier) => ({
        verbose_name: name,
        slug: name,
        type: "branch",
        active,
        identifier,
        urls: { dashboard: { edit: "#" } },
      });
      const input = document.querySelector('input[placeholder="Search versions"]');
      const search = input.closest(".ui.search");
      fakeSearch(search, [version("1.0.x", false, "1.0.x"), version("stable", true, "1.0.x"), version("latest", true, "main")]);
      // Results show on focus
      input.focus();
      jQuery(search).search("query");
      (await until(() => search.querySelector(".results .result"))).classList.add("active");
      await sleep(500);
      aboveFooter();
    })();
  selector: "#shot"
  output: ${OUT}/_static/images/tutorial/inactive-versions.png

