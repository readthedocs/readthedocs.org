# Highlight the configuration file path field, with the fields around it
- url: ${COMMUNITY_URL}/dashboard/${PROJECT}/edit/
  javascript: |-
    ${HELPERS}
    setValue("#id_readthedocs_yaml_path", "docs/.readthedocs.yaml");
    document.querySelector("#id_readthedocs_yaml_path").focus();
    const branch = document.querySelector("#id_default_branch").closest(".ui.dropdown").querySelector(".text");
    branch.textContent = "main";
    branch.classList.remove("default");
    const field = document.querySelector("#div_id_readthedocs_yaml_path");
    Object.assign(field.style, { outline: "3px solid #2185d0", outlineOffset: "8px", borderRadius: "2px" });
    const b = box(field);
    const prev = box(field.previousElementSibling).top;
    const next = box(field.nextElementSibling).bottom;
    clip({ x: b.left - 2 * PAD, y: prev - PAD, width: b.right - b.left + 4 * PAD, height: next - prev + 2 * PAD });
  selector: "#shot"
  output: ${OUT}/img/screenshot-howto-build-configuration-file.png

