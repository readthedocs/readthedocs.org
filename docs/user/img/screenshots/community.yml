# Community screenshots. Run with `make community`, see README.
#
# On production these are created using the rtfd-qa user. This user only has
# read access to select repositories, invite the user again if it is missing
# from the test-builds project.
#
# Placeholders come from prod.env or dev.env, and the HELPERS one is
# helpers.js. `selector: "#shot"` captures the area chosen by its crop helpers.

# Project repository multifield
- url: ${COMMUNITY_URL}/dashboard/${PROJECT}/edit/
  javascript: |-
    ${HELPERS}
  selector: readthedocs-project-repository-multifield
  padding: 20
  output: ${OUT}/img/screenshots/community-project-repo.png

# --- Project settings ---------------------------------------------------------

# Incoming webhook integration, with sample activity. Shown as Community, even
# when the data comes from Business.
- url: ${INTEGRATION_SITE}/dashboard/${INTEGRATION_PROJECT}/integrations/${INTEGRATION_ID}/
  javascript: |-
    ${HELPERS}
    const name = document.querySelector('a[href$="/projects/${INTEGRATION_PROJECT}/"]')?.textContent.trim();
    replaceText([["${INTEGRATION_PROJECT}", "docs"], [name || "${INTEGRATION_PROJECT}", "docs"]]);
    asCommunity();
    const url = fieldInput("Webhook URL");
    url.value = url.value.replace(/^https?:\/\/[^/]+\/api\/v2\/webhook\/[^/]+\//, "https://app.readthedocs.org/api/v2/webhook/docs/");
    // Never publish the real secret
    const secret = fieldInput("Secret");
    if (secret) secret.value = "7tt135QRvfzCxjRLR8kfE1EXR607TwnO";
    document.querySelector(".ui.warning.message")?.remove();
    const times = ["2 minutes ago", "14 minutes ago", "1 hour, 3 minutes ago", "1 hour, 56 minutes ago",
      "3 hours, 12 minutes ago", "5 hours, 40 minutes ago", "1 day, 2 hours ago", "1 day, 4 hours ago",
      "2 days, 1 hour ago", "3 days, 6 hours ago"];
    byText("Recent Activity").nextElementSibling.querySelectorAll(".item").forEach((item, i) => {
      const label = item.querySelector(".ui.label");
      label.className = "ui green label";
      label.textContent = "200";
      item.querySelector("a").textContent = times[i % times.length];
    });
    aboveFooter();
  selector: "#shot"
  output: ${OUT}/img/screenshot-webhook.png

