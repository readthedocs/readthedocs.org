# Business screenshots. Run with `make business`, see README.
#
# On production these are created using the rtfd-qa user. This user only has
# read access to select repositories, invite the user again if it is missing
# from the Read the Docs QA organization and QA team.
#
# Placeholders come from prod.env or dev.env, and the HELPERS one is
# helpers.js. `selector: "#shot"` captures the area chosen by its crop helpers.

# Team select on project manual creation form, with generic organization names
- url: ${BUSINESS_URL}/dashboard/import/manual/
  javascript: |-
    ${HELPERS}
    (async () => {
      const field = document.querySelector("#div_id_organization_team-organization_team");
      const names = ["Example Docs", "Example Company"];
      const seen = [];
      for (const description of field.querySelectorAll(".menu .item .description")) {
        const original = description.textContent.trim();
        if (!seen.includes(original)) seen.push(original);
        description.textContent = names[seen.indexOf(original) % names.length];
      }
      // Warnings that depend on the user's permissions
      for (const label of field.querySelectorAll(".menu .item .label")) {
        if (label.textContent.includes("ownership required")) label.remove();
      }
      const style = document.createElement("style");
      style.textContent = "footer, .footer { display: none !important; } "
        + "#div_id_organization_team-organization_team .menu { max-height: none !important; }";
      document.head.append(style);
      jQuery(field.querySelector(".ui.dropdown")).dropdown("show");
      await sleep(500);
      // Highlight only the chosen team (BUSINESS_TEAM, or the first one)
      const items = [...field.querySelectorAll(".menu .item")];
      const team = items.find((item) => item.dataset.value === "${BUSINESS_TEAM}") || items[0];
      items.forEach((item) => item.classList.remove("selected"));
      team.classList.add("selected");
      contentColumn(byText("Add project"), field.querySelector(".menu"));
    })();
  selector: "#shot"
  output: ${OUT}/img/screenshots/business-project-manual-team-select.png

# Project manual creation form. Submitting the first step only stores the team
# in the session. wait_for runs on the second step, once it's loaded.
- url: ${BUSINESS_URL}/dashboard/import/manual/
  javascript: |-
    const field = document.querySelector("#div_id_organization_team-organization_team");
    const items = [...field.querySelectorAll(".menu .item")];
    const team = items.find((item) => item.dataset.value === "${BUSINESS_TEAM}") || items[0];
    jQuery(field.querySelector(".ui.dropdown")).dropdown("set selected", team.dataset.value);
    document.querySelector('form[action="/dashboard/import/manual/"]').submit();
  wait_for: |-
    (() => {
      if (!document.querySelector("#id_basics-name") || document.readyState !== "complete") return false;
      if (document.querySelector("#shot")) return true;
    ${HELPERS}
      setValue('input[name="basics-name"]', "docs");
      setValue('input[name="basics-repo"]', "git@github.com:readthedocs/readthedocs.org.git");
      document.activeElement.blur();
      contentColumn(byText("Add project"), [...document.querySelectorAll('input[type="submit"]')].pop());
      return true;
    })()
  selector: "#shot"
  output: ${OUT}/img/screenshots/business-project-manual-form.png

# Never publish a real key or fingerprint
- url: ${BUSINESS_URL}/dashboard/${SSH_PROJECT}/keys/${SSH_KEY_ID}/
  javascript: |-
    ${HELPERS}
    replaceText([
      [String.raw`([0-9a-f]{2}:){15}[0-9a-f]{2}`, "01:23:45:67:89:ab:cd:ef:01:23:45:67:89:ab:cd:ef"],
      [String.raw`^ssh-\S+ \S+.*$`, "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC" + "0".repeat(64)],
    ], true);
    replaceText([["${SSH_PROJECT}", "docs"]]);
    const heading = xpath('//*[self::h1 or self::h2][contains(normalize-space(), "SSH keys")]');
    const last = xpath('(//input | //textarea)[last()]/ancestor::div[contains(@class,"field")][1]');
    contentColumn(heading, last);
  selector: "#shot"
  output: ${OUT}/img/screenshots/business-project-ssh-key.png
