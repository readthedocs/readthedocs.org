{% comment %}
  Previous/next links for the ``page_obj`` set by paginated list views.
{% endcomment %}
{% if page_obj.has_other_pages %}
  <div class="pagination">
    {% if page_obj.has_previous %}
      <a href="{% querystring page=page_obj.previous_page_number %}">&lsaquo;&lsaquo;</a>
    {% endif %}
    <span class="current">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a href="{% querystring page=page_obj.next_page_number %}">&rsaquo;&rsaquo;</a>
    {% endif %}
  </div>
{% endif %}
