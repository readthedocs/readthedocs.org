[tox]
envlist = sphinx-{62,74,82,latest}

[testenv]
description = run test suite for the EmbedAPIv3
skip_install = true
allowlist_externals =
    sh
    uv
deps =
    readthedocsext-theme@git+https://github.com/readthedocs/ext-theme.git@main
    sphinx-62: Sphinx~=6.2.0
    sphinx-62: sphinxcontrib-bibtex~=2.0
    sphinx-74: Sphinx~=7.4.0
    sphinx-82: Sphinx~=8.2.0
    sphinx-latest: Sphinx
    sphinxcontrib-bibtex
commands_pre =
    # Install the test requirements without their pinned Sphinx,
    # so the Sphinx version from `deps` stays installed.
    sh -c 'grep -v "^sphinx" {toxinidir}/requirements/testing.txt > {envtmpdir}/requirements.txt'
    uv pip install --python {envpython} -r {envtmpdir}/requirements.txt
setenv =
    DJANGO_SETTINGS_MODULE=readthedocs.settings.test
changedir = {toxinidir}/readthedocs
commands =
    python -c "import sphinx; print('Sphinx', sphinx.__version__)"
    pytest -m embed_api --nomigrations {posargs}
