[tox]
# NOTE: Currently tox 3 is required, breaks with tox 4, possibly basepython 3.10 needs to be defined
requires =
  tox<4
  setuptools==75.8.0

envlist = sphinx-{45,53,62,74,82,latest}

[testenv]
description = run test suite for the EmbedAPIv3
allowlist_externals =
    sh
install_command =
    # Install requirements in multiple steps because we don't want to install
    # Sphinx from `requirements/pip.txt` but from the `deps=` field.
    #
    # `uv pip install` and not `uv pip sync`: tox runs this command twice (once
    # for `deps=`, once for the package), and `sync` makes the environment match
    # the given file exactly. On the second run it would uninstall both the
    # Sphinx version pinned by `deps=` and the setuptools seeded by virtualenv,
    # which Sphinx < 7 needs for `pkg_resources`.
    #
    # `set -e` so that a failing install fails the environment instead of
    # leaving a half-installed one behind: `sh -c 'a; b'` only reports the exit
    # code of `b`.
    #
    # `{opts}` is not passed through, tox adds pip-only flags to it
    # (`--exists-action w`) that uv doesn't understand.
    sh -c 'set -e; \
        cat {toxinidir}/requirements/testing.txt | grep -v "Sphinx" > {toxinidir}/requirements/embedapi.txt; \
        uv pip install -r {toxinidir}/requirements/embedapi.txt; \
        uv pip install $*;' -- {packages}
deps =
    sphinx-45: Sphinx~=4.5.0
    sphinx-53: Sphinx~=5.3.0
    sphinx-62: Sphinx~=6.2.0 sphinxcontrib-bibtex~=2.0
    sphinx-74: Sphinx~=7.4.0
    sphinx-82: Sphinx~=8.2.0
    sphinx-latest: Sphinx
    sphinxcontrib-bibtex
setenv =
    DJANGO_SETTINGS_MODULE=readthedocs.settings.test
    VIRTUALENV_SETUPTOOLS=75.8.0
changedir = {toxinidir}/readthedocs
commands = pytest -m embed_api --nomigrations {posargs}
